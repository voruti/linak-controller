name: Docker Image CI

on:
  push:
    branches: ["typescript-rewrite"]
  pull_request:
    branches: ["typescript-rewrite"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Build the Docker image
        run: docker build . --file recipes/docker/Dockerfile --tag linak-controller:$(date +%s)
