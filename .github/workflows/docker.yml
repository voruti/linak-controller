name: Docker Image CI

on:
  push:
    branches: ["typescript-rewrite"]
  pull_request:
    branches: ["typescript-rewrite"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build the Docker image
        run: docker build . --file recipes/docker/Dockerfile --tag linak-controller:$(date +%s)
