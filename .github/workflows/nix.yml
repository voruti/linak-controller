name: Nix flake CI

on:
  push:
    branches: ["typescript-rewrite"]
  pull_request:
    branches: ["typescript-rewrite"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix build --print-build-logs --print-out-paths
      - run: nix flake check
